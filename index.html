<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020712" />
    <meta
      name="description"
      content="The Blue Voyage — một hành trình ký ức dành cho Pastel."
    />
    <title>The Blue Voyage — Pastel</title>
  </head>
  <body class="is-intro-locked">
    <a class="skip-link" href="#blue-road">Bỏ qua phần mở đầu</a>

    <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>
    <canvas id="whale-canvas" class="whale-canvas" aria-hidden="true"></canvas>
    <div class="film-grain" aria-hidden="true"></div>

    <header class="ambient-header" aria-label="Tiến trình hành trình">
      <a class="wordmark" href="#memory-drops" aria-label="Về đầu hành trình">
        <span class="wordmark__mark" aria-hidden="true"></span>
        <span>THE BLUE VOYAGE</span>
      </a>
      <div class="scene-progress" aria-hidden="true">
        <span class="scene-progress__line"><i id="progress-line"></i></span>
        <span class="scene-progress__dot is-active"></span>
        <span class="scene-progress__dot"></span>
        <span class="scene-progress__dot"></span>
        <span class="scene-progress__dot"></span>
      </div>
    </header>

    <main id="experience">
      <section id="memory-drops" class="scene scene--intro" data-scene="intro" aria-label="Mở đầu">
        <div class="scene__sticky intro-world">
          <div class="intro-aurora" aria-hidden="true"></div>

          <div class="intro-copy">
            <p class="eyebrow">A MEMORY OCEAN FOR</p>
            <h1>PASTEL</h1>
            <p class="intro-copy__line">Có những ký ức chỉ xuất hiện khi ta giữ chúng đủ lâu.</p>
          </div>

          <div id="drop-layer" class="drop-layer" aria-hidden="true"></div>

          <button id="hold-control" class="hold-control" type="button" aria-describedby="hold-status">
            <svg class="hold-control__ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="hold-control__track" cx="60" cy="60" r="54"></circle>
              <circle id="hold-progress" class="hold-control__progress" cx="60" cy="60" r="54"></circle>
            </svg>
            <span class="hold-control__drop" aria-hidden="true"><i></i></span>
            <span id="hold-label" class="hold-control__label">NHẤN VÀ GIỮ</span>
          </button>
          <p id="hold-status" class="sr-only" aria-live="polite">Nhấn và giữ để bắt đầu hành trình.</p>

          <button id="skip-intro" class="text-button intro-skip" type="button">BỎ QUA MỞ ĐẦU</button>

          <div class="intro-ocean" aria-hidden="true">
            <span class="intro-ocean__glow"></span>
            <span class="intro-ocean__surface"></span>
            <span class="intro-ocean__reflection"></span>
          </div>

          <div class="scroll-cue intro-scroll-cue" aria-hidden="true">
            <span>CUỘN ĐỂ TIẾP TỤC</span>
            <i></i>
          </div>
        </div>
      </section>

      <section id="blue-road" class="scene scene--journey" data-scene="journey" aria-label="Con đường màu xanh">
        <div class="scene__sticky journey-world">
          <div class="water-rays" aria-hidden="true"></div>
          <div class="depth-haze depth-haze--one" aria-hidden="true"></div>
          <div class="depth-haze depth-haze--two" aria-hidden="true"></div>
          <div id="portal-layer" class="portal-layer" aria-hidden="true"></div>
          <div id="drift-layer" class="drift-layer" aria-hidden="true"></div>
          <div class="journey-vignette" aria-hidden="true"></div>
          <div class="scroll-cue journey-scroll-cue" aria-hidden="true"><i></i></div>
        </div>
      </section>

      <section id="storm" class="scene scene--storm" data-scene="storm" aria-label="Giữa những con sóng">
        <div class="scene__sticky storm-world">
          <div class="storm-current storm-current--one" aria-hidden="true"></div>
          <div class="storm-current storm-current--two" aria-hidden="true"></div>
          <div id="shard-field" class="shard-field" aria-hidden="true"></div>
          <div id="companion-whales" class="companion-whales" aria-hidden="true"></div>
          <div class="surface-rift" aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="breakthrough-flash" class="breakthrough-flash" aria-hidden="true"></div>
        </div>
      </section>

      <section id="ocean-remembers" class="scene scene--finale" data-scene="finale" aria-label="Đại dương còn nhớ">
        <div class="scene__sticky finale-world">
          <div class="cosmic-current cosmic-current--one" aria-hidden="true"></div>
          <div class="cosmic-current cosmic-current--two" aria-hidden="true"></div>

          <div id="memory-whale" class="memory-whale" role="img" aria-label="Cá voi được tạo nên từ những khoảnh khắc của Pastel">
            <div id="memory-grid" class="memory-grid"></div>
            <span class="memory-whale__shine" aria-hidden="true"></span>
            <span class="memory-whale__heart" aria-hidden="true"></span>
          </div>

          <div class="finale-copy">
            <p class="eyebrow">THE OCEAN REMEMBERS</p>
            <h2>PASTEL</h2>
            <p id="final-message" class="finale-copy__message">Hành trình vẫn đang tiếp tục.</p>
          </div>

          <button id="send-light" class="light-button" type="button">
            <span class="light-button__orb" aria-hidden="true"></span>
            <span>GỬI MỘT ÁNH SÁNG</span>
          </button>
          <div id="light-layer" class="light-layer" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <noscript>
      <div class="noscript-message">Website cần JavaScript để hiển thị hành trình hình ảnh.</div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
